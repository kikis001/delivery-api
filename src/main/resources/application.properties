spring.application.name=delivery-api

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_app
spring.datasource.username=admin
spring.datasource.password=password123

# Configuración de Hibernate (Crea/Actualiza las tablas automáticamente al iniciar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configuración por defecto de Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Configuración de JWT (Externalizada con variables de entorno)
jwt.secret=${JWT_SECRET:M1Cl4v3Sup3rS3cr3t4P4r4D3l1v3ryAp1MuYMuYLarg4Y5egura123}
jwt.expiration=${JWT_EXPIRATION:7200000}
